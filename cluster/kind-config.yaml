# Kind cluster configuration for Argo Rollouts Lab
#
# Usage:
#   kind create cluster --name argo-rollouts-lab --config cluster/kind-config.yaml
#
# Features:
#   - 1 control-plane + 2 worker nodes
#   - Ingress-ready with port mappings (80, 443)
#   - Extra port for NodePort services
#   - Local registry support

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: argo-rollouts-lab

nodes:
  # Control plane node
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP - Ingress
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS - Ingress
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # NodePort range for services
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP

  # Worker nodes
  - role: worker
  - role: worker

# Networking configuration
networking:
  # Disable default CNI and use kindnet
  disableDefaultCNI: false
  # Pod subnet
  podSubnet: "10.244.0.0/16"
  # Service subnet
  serviceSubnet: "10.96.0.0/16"

# Container registry configuration (optional)
# Uncomment to use local registry
# containerdConfigPatches:
#   - |-
#     [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
#       endpoint = ["http://kind-registry:5000"]
