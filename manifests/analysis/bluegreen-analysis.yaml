apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: bluegreen-pre-analysis
  namespace: demo-app
spec:
  args:
    - name: service-name
  metrics:
    # Health check - verify pods are healthy
    - name: health-check
      interval: 10s
      count: 3
      successCondition: result[0] == 1
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            min(up{service="{{args.service-name}}"})

    # Verify no errors in preview environment
    - name: preview-error-check
      interval: 15s
      count: 4
      successCondition: result[0] <= 0.02
      failureCondition: result[0] > 0.05
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_errors_total{service="{{args.service-name}}"}[1m]))
            /
            (sum(rate(http_requests_total{service="{{args.service-name}}"}[1m])) + 0.001)

    # Smoke test - verify endpoint is responding
    - name: smoke-test
      interval: 10s
      count: 3
      successCondition: result[0] > 0
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}"}[1m]))
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: bluegreen-post-analysis
  namespace: demo-app
spec:
  args:
    - name: service-name
  metrics:
    # Monitor error rate after promotion
    - name: post-promotion-error-rate
      interval: 30s
      count: 5
      successCondition: result[0] <= 0.03
      failureCondition: result[0] > 0.10
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_errors_total{service="{{args.service-name}}"}[2m]))
            /
            (sum(rate(http_requests_total{service="{{args.service-name}}"}[2m])) + 0.001)

    # Monitor latency spike after promotion
    - name: post-promotion-latency
      interval: 30s
      count: 5
      successCondition: result[0] <= 500
      failureCondition: result[0] > 1000
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{service="{{args.service-name}}"}[2m])) by (le)
            ) * 1000

    # Throughput check - ensure service is handling traffic
    - name: throughput-check
      interval: 30s
      count: 3
      successCondition: result[0] > 0.1
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))
