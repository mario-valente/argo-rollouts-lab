apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-app-canary-experiment
  namespace: demo-app
  labels:
    app: demo-app-experiment
    strategy: canary-experiment
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: demo-app-experiment
  template:
    metadata:
      labels:
        app: demo-app-experiment
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: demo-app
          image: demo-app:v1
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "v1"
            - name: APP_COLOR
              value: "blue"
            - name: ERROR_RATE
              value: "0.0"
            - name: LATENCY_MS
              value: "50"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
  strategy:
    canary:
      canaryService: demo-app-experiment-canary
      stableService: demo-app-experiment-stable

      steps:
        # Step 1: Run an experiment before any traffic shift
        - experiment:
            duration: 2m
            templates:
              - name: canary-preview
                specRef: canary
                replicas: 2
              - name: baseline
                specRef: stable
                replicas: 2
            analyses:
              - name: experiment-analysis
                templateName: experiment-comparison-analysis
                args:
                  - name: canary-hash
                    valueFrom:
                      podTemplateHashValue: Latest
                  - name: baseline-hash
                    valueFrom:
                      podTemplateHashValue: Stable

        # Step 2: If experiment passes, start canary rollout
        - setWeight: 20
        - pause: { duration: 30s }

        # Step 3: Continue with traffic shift
        - setWeight: 40
        - analysis:
            templates:
              - templateName: success-rate-analysis
            args:
              - name: service-name
                value: demo-app-experiment-canary
        - pause: { duration: 30s }

        # Step 4: More traffic
        - setWeight: 60
        - pause: { duration: 30s }

        # Step 5: Almost full traffic
        - setWeight: 80
        - pause: { duration: 30s }

        # Step 6: Full traffic
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-experiment-stable
  namespace: demo-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: demo-app-experiment
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-experiment-canary
  namespace: demo-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: demo-app-experiment
